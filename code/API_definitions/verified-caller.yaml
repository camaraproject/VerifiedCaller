openapi: 3.0.3
info:
  title: Verified Caller
  description: |
    This API provides the ability to verify the authenticity of a call from a specific caller to a specific callee. Within the context of this API, *verification of authenticity* of a phone call is to demonstrate to the callee that the call indeed has been placed by the legitimate owner of a phone number.

    # Introduction

    A brand's owner (henceforth the "API customer") can use the Verified Caller API to demonstrate the authenticity of a call they place to a callee from one of their legitimate phone numbers.
    A relationship between the API customer and the service provider has to be already established, so that the service provider is aware of the API customer's legitimate phone numbers and brand(s).
    This can be achieved by using the Brand Registration API, or another mechanism agreed upon by the API customer and the service provider.
    The API customer can choose to consume API directly, or via a third party (typically called a "service integrator") that acts on behalf of the API customer.
    In the former case, the API customer and the API consumer/client are the same. In the latter case, the API consumer/client is a different entity that legitimately acts on behalf of the API customer.

    Verified Caller API could be useful in scenarios such as:
    - Telesales
    - Customer Support
    - Outreach efforts of NGOs.
    - Calls placed by authorities or government institutions for official matters.


    # Relevant terms and definitions
    * **Brand** : A user-friendly text to represent the identity of a caller to a callee.
    * **API customer**: An entity that owns one or more phone numbers with associated brands. The API customer uses the API to demonstrate the authenticity of the calls it places. The API customer is not necessarily the entity that actually consumes the API.
    * **API consumer/client**: An entity that programatically consumes the API on behalf of the API customer.
    * **Service integrator**: A typically commercial entity that consumes the API on behalf of the API customer to relieve them of the technical implementations. A service integrator may serve several API customers for a specific API exposed by different service providers.
    * **Service provider**: An entity that provides the telephony service together with the call verification capabilities. The service provider is also assumed to expose the Verified Caller API (i.e. act as API Provider).

    # API Functionality
    When the brand's owner decides to place a call, they consume (directly or via an integrator) the Verified Caller API to inform the service provider of their intent. Within the context of this API, this action is called a *pre-announcement* for a call. The API request parameters are populated as follows:
    * **callingParticipant**: Which one of the API customer's phone numbers will be used to originate the call.
    * **calledParticipant**: To which phone number the call will be placed.
    * **strategy**: How the authenticity of the call shall be demonstrated to the callee.
      * *BRAND_DISPLAY* : A brand (a user-friendly text) is displayed to the callee on their device screen. This strategy is typically chosen when the Verified Caller API is used together with the Brand Registration API.
      * *SMS* : A short message is sent to the callee to inform them about the legitimacy of the call. Reserved for future use.
    * **timeToLive**: The period for which the brand owner's call intent remains valid. A call *not* placed within the *timeToLive* duration shall not be considered as verified by the service provider. In that case, the service provider may continue the call without performing the action specified via the *strategy* parameter, or drop the call (If used, the Brand Registration API provides the API customer a means to indicate the preferred behavior). The service provider may choose to reject an API request based on the timeToLive value, or apply a different value than requested. The service provider shall observe the timeToLive value for all accepted requests. In order to reduce the risk of a spoofed call, the service provider is advised to verify exactly one phone call per API request. In other words, a 2nd, 3rd,.. etc. call between the same phone nubers *should* not be considered as verified even if made within the *timeToLive* period.
    * **registrationId** : A unique reference to the relationship between the API customer and the service provider. If provided, this value may help the service provider to fetch information related to their pre-established relationship more effectively.
    * **dynamicDisplayName**: If strategy is 'BRAND_DISPLAY', this parameter may be provided to override any pre-arranged display name presented to the callee, e.g. one set using the Brand Registation API request.
    * **callReason**: If strategy is 'BRAND_DISPLAY', this parameter may be provided to present a *call reason* is to the callee in addition to the display name to provide additional context about the call. It is assumed the *call reason* is displayed in another section of the device's screen to accompany the *brand*. An operator, interconnect or device MAY not support this parameter.


    The API exposes the following endpoints/operations:
    - `/pre-announce` :
      - **POST** operation creates a new pre-announcement for a call

    <!-- CAMARA:MANDATORY:authorization-and-authentication:BEGIN -->
    # Authorization and authentication

    The "Camara Security and Interoperability Profile" provides details of how an API consumer requests an access token. Please refer to Identity and Consent Management (https://github.com/camaraproject/IdentityAndConsentManagement/) for the released version of the profile.

    The specific authorization flows to be used will be agreed upon during the onboarding process, happening between the API consumer and the API provider, taking into account the declared purpose for accessing the API, whilst also being subject to the prevailing legal framework dictated by local legislation.

    In cases where personal data is processed by the API and users can exercise their rights through mechanisms such as opt-in and/or opt-out, the use of three-legged access tokens is mandatory. This ensures that the API remains in compliance with privacy regulations, upholding the principles of transparency and user-centric privacy-by-design.
    <!-- CAMARA:MANDATORY:authorization-and-authentication:END -->

    <!-- CAMARA:MANDATORY:additional-error-responses:BEGIN -->
    # Additional CAMARA error responses

    The list of error codes in this API specification is not exhaustive. Therefore the API specification MAY not document some non-mandatory error statuses as indicated in `CAMARA API Design Guide`.

    Please refer to the `CAMARA_common.yaml` of the Commonalities Release associated to this API version for a complete list of error responses. The applicable Commonalities Release can be identified in the `API Readiness Checklist` document associated to this API version.

    As a specific rule, error `501 - NOT_IMPLEMENTED` can be only a possible error response if it is explicitly documented in the API.
    <!-- CAMARA:MANDATORY:additional-error-responses:END -->

    <!-- CAMARA:MANDATORY:request-body-strictness:BEGIN -->
    # Request body strictness

    This API rejects requests with JSON request bodies that contain properties not declared in this specification, at any nesting level. Unknown properties result in a `400 INVALID_ARGUMENT` response.
    <!-- CAMARA:MANDATORY:request-body-strictness:END -->

